name: Release build

# Every push to main builds a signed release APK (downloadable from the run's artifacts).
# Pushing a tag like v1.2.0 additionally publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed only to create the GitHub Release on tag pushes

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Required repo secrets (Settings → Secrets and variables → Actions):
      #   SIGNING_KEYSTORE_BASE64  base64 of the keystore file
      #   SIGNING_STORE_PASSWORD   keystore password
      #   SIGNING_KEY_ALIAS        key alias
      #   SIGNING_KEY_PASSWORD     key password (same as the store password for most PKCS12 keys)
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set — cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          case "$src" in *unsigned*) echo "::error::APK is unsigned — check the signing secrets."; exit 1;; esac
          ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          name="goclaw-chat-${ver}-${GITHUB_SHA::7}.apk"
          mv "$src" "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
